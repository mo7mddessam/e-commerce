<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>M.E — Contemporary streetwear</title>
  <meta name="description" content="M.E — premium urban streetwear and contemporary fashion for men and women.">
  <meta name="theme-color" content="#0a0a0c">
  <link rel="icon" href="/assets/hex-emblem.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body data-layout="site">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="netbar" id="netbar" aria-hidden="true"></div>

  <div id="site" class="shell-site">
    <header class="nav" id="nav"></header>
    <main id="main" class="view" tabindex="-1"></main>
    <footer id="footer" class="footer"></footer>
  </div>

  <div id="admin" class="shell-admin" hidden>
    <aside class="admin-side" id="admin-side"></aside>
    <div class="admin-body">
      <div class="admin-top" id="admin-top"></div>
      <main id="admin-main" class="admin-view" tabindex="-1"></main>
    </div>
  </div>

  <div id="overlays"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem;color:#fff">M.E requires JavaScript.</p></noscript>
  <script src="/config.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
